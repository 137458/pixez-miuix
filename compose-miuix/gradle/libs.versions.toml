[versions]
# Kotlin / Compose
kotlin = "2.4.0"
compose = "1.11.1"
android-gradle-plugin = "8.13.0"

# MIUIX
# 0.9.x 要求 compileSdk 37（Android 17 预览版），在稳定版 CI 中无法自动安装；
# 退回到 0.8.8，其 compileSdk 为 36，与当前稳定 Android SDK 一致。
miuix = "0.8.8"

# KMP / Android 基础
androidx-activity-compose = "1.10.1"
androidx-lifecycle = "2.9.4"
androidx-core-ktx = "1.16.0"

# 网络 / 序列化
ktor = "3.1.2"
kotlinx-serialization = "1.8.1"
kotlinx-coroutines = "1.10.2"

# 数据库 / 存储
sqldelight = "2.0.2"
multiplatform-settings = "1.3.0"

# 图片
coil = "3.3.0"

# DI / 导航 / 工具
decompose = "3.3.0"
koin = "4.0.4"
koin-compose = "4.0.4"
napier = "2.7.1"
kotlinx-datetime = "0.6.2"

# 测试
junit = "4.13.2"

[libraries]
# Compose Multiplatform artifact 由 org.jetbrains.compose 插件通过 compose.* / compose.dependencies.* DSL 管理，
# 不在这里声明，以避免平台 artifact 坐标错误（如 material3 / material-icons-extended 无通用 common artifact）。

# MIUIX
# 0.8.8 在 Maven Central 上以单包形式发布：top.yukonga.miuix.kmp:miuix:0.8.8，
# UI / Preference / 基础 Icons 等模块均为该包的内部子模块，不再提供独立 artifact。
# 扩展图标库仍使用独立 artifact：top.yukonga.miuix.kmp:miuix-icons:0.8.8。
miuix = { module = "top.yukonga.miuix.kmp:miuix", version.ref = "miuix" }
miuixIcons = { module = "top.yukonga.miuix.kmp:miuix-icons", version.ref = "miuix" }

# Compose Android
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity-compose" }
androidx-lifecycle-viewmodel = { module = "androidx.lifecycle:lifecycle-viewmodel", version.ref = "androidx-lifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }

# Ktor
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-client-darwin = { module = "io.ktor:ktor-client-darwin", version.ref = "ktor" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-client-logging = { module = "io.ktor:ktor-client-logging", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }

# Kotlinx
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinx-datetime" }

# SQLDelight
sqldelight-runtime = { module = "app.cash.sqldelight:runtime", version.ref = "sqldelight" }
sqldelight-coroutines-extensions = { module = "app.cash.sqldelight:coroutines-extensions", version.ref = "sqldelight" }
sqldelight-android-driver = { module = "app.cash.sqldelight:android-driver", version.ref = "sqldelight" }
sqldelight-native-driver = { module = "app.cash.sqldelight:native-driver", version.ref = "sqldelight" }
sqldelight-sqlite-driver = { module = "app.cash.sqldelight:sqlite-driver", version.ref = "sqldelight" }

# Multiplatform Settings
multiplatform-settings = { module = "com.russhwolf:multiplatform-settings", version.ref = "multiplatform-settings" }
multiplatform-settings-coroutines = { module = "com.russhwolf:multiplatform-settings-coroutines", version.ref = "multiplatform-settings" }

# Coil
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
coil-network-ktor3 = { module = "io.coil-kt.coil3:coil-network-ktor3", version.ref = "coil" }

# Decompose
decompose = { module = "com.arkivanov.decompose:decompose", version.ref = "decompose" }
decompose-compose = { module = "com.arkivanov.decompose:extensions-compose", version.ref = "decompose" }

# Koin
koin-core = { module = "io.insert-koin:koin-core", version.ref = "koin" }
koin-compose = { module = "io.insert-koin:koin-compose", version.ref = "koin-compose" }
koin-android = { module = "io.insert-koin:koin-android", version.ref = "koin" }

# Logging
napier = { module = "io.github.aakira:napier", version.ref = "napier" }

# Test
junit = { module = "junit:junit", version.ref = "junit" }

[plugins]
androidApplication = { id = "com.android.application", version.ref = "android-gradle-plugin" }
androidLibrary = { id = "com.android.library", version.ref = "android-gradle-plugin" }
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlinSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "compose" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
sqldelight = { id = "app.cash.sqldelight", version.ref = "sqldelight" }
