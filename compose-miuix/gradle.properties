org.gradle.jvmargs=-Xmx4G -Dfile.encoding=UTF-8 -Dhttps.protocols=TLSv1.2,TLSv1.3
org.gradle.caching=true
org.gradle.configuration-cache=false
kotlin.code.style=official
kotlin.cpp.standalone=true
android.useAndroidX=true
android.nonTransitiveRClass=true
org.jetbrains.compose.experimental.macos.enabled=true
# 启用 R8 Full Mode 深度死代码剥离与方法内联优化
android.enableR8.fullMode=true
# 启用 Kotlin 并行编译优化
kotlin.incremental=true
kotlin.parallel.tasks.in.project=true
# shared 刻意声明 jvmShared 中间源集并用显式 dependsOn 串联（androidMain/desktopMain -> jvmShared -> commonMain），
# 与默认层级模板自动生成的中间源集冲突；关闭模板，源集层级完全由 build 脚本声明。
kotlin.mpp.applyDefaultHierarchyTemplate=false
