name: Build Compose MIUIX

on:
  push:
    paths:
      - 'compose-miuix/**'
      - '.github/workflows/build_compose_miuix.yml'
  pull_request:
    paths:
      - 'compose-miuix/**'
      - '.github/workflows/build_compose_miuix.yml'
  workflow_dispatch:

jobs:
  android:
    name: Android Debug
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: compose-miuix
    steps:
      - name: 签出仓库
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 配置 Android SDK
        uses: android-actions/setup-android@v3

      - name: 安装 Android 36 平台 SDK
        run: |
          # runner 预装的 cmdline-tools 版本过旧（12.0），无法识别 Android 16（API 36），
          # 因此手动下载最新 command-line tools 覆盖到 cmdline-tools/latest。
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-12266719_latest.zip -O /tmp/cmdline-tools.zip
          rm -rf $ANDROID_HOME/cmdline-tools/latest
          mkdir -p $ANDROID_HOME/cmdline-tools/latest
          unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-tools
          mv /tmp/cmdline-tools/cmdline-tools/* $ANDROID_HOME/cmdline-tools/latest/
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null 2>&1 || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.1.0"

      - name: 缓存 Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-home-cache-cleanup: true

      - name: 授予 gradlew 执行权限
        run: chmod +x gradlew

      - name: 构建 Android Debug APK
        run: ./gradlew :composeApp:assembleDebug --no-daemon --stacktrace -Dorg.gradle.java.home=$JAVA_HOME

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: composeApp/build/outputs/apk/debug/*.apk
          compression-level: 9

  desktop:
    name: Desktop Compile
    runs-on: windows-latest
    defaults:
      run:
        working-directory: compose-miuix
    steps:
      - name: 签出仓库
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 缓存 Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-home-cache-cleanup: true

      - name: 编译 Desktop
        run: ./gradlew.bat :composeApp:compileKotlinDesktop --no-daemon --stacktrace "-Dorg.gradle.java.home=%JAVA_HOME%"

  ios-macos:
    name: iOS/macOS Compile
    runs-on: macos-latest
    defaults:
      run:
        working-directory: compose-miuix
    steps:
      - name: 签出仓库
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 缓存 Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-home-cache-cleanup: true

      - name: 授予 gradlew 执行权限
        run: chmod +x gradlew

      - name: 编译 iOS / macOS 共享模块
        run: ./gradlew :shared:compileKotlinIosArm64 :shared:compileKotlinIosSimulatorArm64 :shared:compileKotlinMacosArm64 --no-daemon --stacktrace -Dorg.gradle.java.home=$JAVA_HOME
