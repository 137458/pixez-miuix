name: Build Compose MIUIX

on:
  push:
    paths:
      - 'compose-miuix/**'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'RELEASE_NOTES_GUIDE.md'
      - '.github/FAQ.md'
      - '.github/README_en.md'
      - '.github/README_id.md'
      - '.github/workflows/build_compose_miuix.yml'
  pull_request:
    paths:
      - 'compose-miuix/**'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'RELEASE_NOTES_GUIDE.md'
      - '.github/FAQ.md'
      - '.github/README_en.md'
      - '.github/README_id.md'
      - '.github/workflows/build_compose_miuix.yml'
  workflow_dispatch:

# 同分支连续 push 时取消进行中的旧构建，避免三平台昂贵构建并行堆积
concurrency:
  group: build-compose-miuix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android Debug
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: compose-miuix
    steps:
      - name: 签出仓库
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 配置 Android SDK
        uses: android-actions/setup-android@v3

      - name: 安装 Android 36 平台 SDK
        run: |
          # runner 预装的 cmdline-tools 版本过旧（12.0），无法识别 Android 16（API 36），
          # 因此手动下载最新 command-line tools 覆盖到 cmdline-tools/latest。
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-12266719_latest.zip -O /tmp/cmdline-tools.zip
          rm -rf $ANDROID_HOME/cmdline-tools/latest
          mkdir -p $ANDROID_HOME/cmdline-tools/latest
          unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-tools
          mv /tmp/cmdline-tools/cmdline-tools/* $ANDROID_HOME/cmdline-tools/latest/
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null 2>&1 || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.1.0"

      - name: 缓存 Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-home-cache-cleanup: true

      - name: 授予 gradlew 执行权限
        run: chmod +x gradlew

      - name: 构建 Android Release APK
        run: ./gradlew :composeApp:assembleRelease --no-daemon --stacktrace -Dorg.gradle.java.home=$JAVA_HOME

      # Windows 的 desktopTest 不覆盖 Android 变体，且迁移校验被 onlyIf 排除在 Windows 之外，
      # 因此 JVM 单元测试与 SQLDelight 迁移校验统一放在本 job（ubuntu）执行。
      - name: 运行 Android 变体单元测试与 SQLDelight 迁移校验
        run: ./gradlew :shared:testDebugUnitTest :shared:verifySqlDelightMigration --no-daemon --stacktrace -Dorg.gradle.java.home=$JAVA_HOME

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: android-release-apk
          path: composeApp/build/outputs/apk/release/*.apk
          compression-level: 9

  desktop:
    name: Desktop Build & Package
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: compose-miuix
    steps:
      - name: 签出仓库
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 缓存 Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-home-cache-cleanup: true

      - name: 运行 Desktop 回归测试并打包单文件 EXE、便携 ZIP 与 MSI 安装包
        run: ./gradlew.bat :composeApp:desktopTest :composeApp:packageMsi :composeApp:packageWindowsPortableZip :composeApp:packageWindowsSingleFileExe --no-daemon --stacktrace "-Dorg.gradle.java.home=%JAVA_HOME%"

      - name: 上传 Desktop 单文件自包含 EXE
        uses: actions/upload-artifact@v4
        with:
          name: pixez-desktop-windows-x64-standalone-exe
          path: compose-miuix/composeApp/build/compose/binaries/main/single-exe/*.exe
          compression-level: 9

      - name: 上传 Desktop 便携绿色版 ZIP
        uses: actions/upload-artifact@v4
        with:
          name: pixez-desktop-windows-x64-portable
          path: compose-miuix/composeApp/build/compose/binaries/main/zip/*.zip
          compression-level: 9

      - name: 上传 Desktop Windows MSI 安装包
        uses: actions/upload-artifact@v4
        with:
          name: pixez-desktop-windows-x64-installer-msi
          path: compose-miuix/composeApp/build/compose/binaries/main/msi/*.msi
          compression-level: 9

  ios-macos:
    name: iOS Compile
    runs-on: macos-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: compose-miuix
    steps:
      - name: 签出仓库
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 缓存 Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-home-cache-cleanup: true

      - name: 授予 gradlew 执行权限
        run: chmod +x gradlew

      - name: 编译 iOS 共享模块
        run: ./gradlew :shared:compileKotlinIosArm64 :shared:compileKotlinIosSimulatorArm64 --no-daemon --stacktrace -Dorg.gradle.java.home=$JAVA_HOME


