name: Build Compose MIUIX

on:
  push:
    paths:
      - 'compose-miuix/**'
      - '.github/workflows/build_compose_miuix.yml'
  pull_request:
    paths:
      - 'compose-miuix/**'
      - '.github/workflows/build_compose_miuix.yml'
  workflow_dispatch:

jobs:
  android:
    name: Android Debug
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: compose-miuix
    steps:
      - name: 签出仓库
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 配置 Android SDK
        uses: android-actions/setup-android@v3

      - name: 安装 Android 37 平台 SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null 2>&1 || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-37" "build-tools;37.0.0"

      - name: 缓存 Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-home-cache-cleanup: true

      - name: 授予 gradlew 执行权限
        run: chmod +x gradlew

      - name: 构建 Android Debug APK
        run: ./gradlew :composeApp:assembleDebug --no-daemon --stacktrace -Dorg.gradle.java.home=$JAVA_HOME

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: composeApp/build/outputs/apk/debug/*.apk
          compression-level: 9

  desktop:
    name: Desktop Compile
    runs-on: windows-latest
    defaults:
      run:
        working-directory: compose-miuix
    steps:
      - name: 签出仓库
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 缓存 Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-home-cache-cleanup: true

      - name: 编译 Desktop
        run: ./gradlew.bat :composeApp:compileKotlinDesktop --no-daemon --stacktrace "-Dorg.gradle.java.home=%JAVA_HOME%"
